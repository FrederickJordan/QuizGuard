<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuizGuard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="flash-warning" id="tabWarning">
  ⚠ TAB SWITCH DETECTED ⚠<br><br>
  Return to the quiz immediately!
</div>

<div class="app">

  <div class="panel quiz-panel">

    <div class="top-bar">
      <div class="badge">Score: <span id="score">0</span></div>
      <div class="badge">Penalties: <span id="penalties">0</span></div>
      <div class="badge warning">Tab Switches: <span id="tabSwitches">0</span></div>
    </div>

    <div class="question-box" id="quizContent">

      <div class="question-number" id="questionNumber">
        Question 1 / 3
      </div>

      <div class="question" id="questionText"></div>

      <div class="answers" id="answersContainer"></div>

      <div class="anti-cheat-box">
        <strong>QuizGuard Anti-Cheat:</strong><br>
        The minigame is always active while answering questions.
      </div>
    </div>

    <div class="results-screen" id="resultsScreen">
      <h1>Quiz Complete</h1>

      <div class="results-box">
        <div class="result-item">
          Final Score:
          <span class="highlight" id="finalScore"></span>
        </div>

        <div class="result-item">
          Minigame Failures:
          <span class="highlight" id="finalFailures"></span>
        </div>

        <div class="result-item">
          Tab Switches:
          <span class="highlight" id="finalTabs"></span>
        </div>

        <div class="result-item">
          Penalty Points:
          <span class="highlight" id="finalPenalty"></span>
        </div>
      </div>
    </div>

  </div>

  <div class="panel game-panel">

    <div class="game-title" id="gameTitle">
      Active Minigame
    </div>

    <div class="game-description" id="gameDescription"></div>

    <div class="game-area" id="gameArea"></div>

    <div class="log-area" id="logArea"></div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
