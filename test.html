<!DOCTYPE html>
<html>
<head>
  <title>Firebase Test</title>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
</head>
<body>
  <h2>Firebase Login Test</h2>
  <input type="email" id="email" placeholder="Email"><br>
  <input type="password" id="password" placeholder="Password"><br>
  <button id="login">Login</button>
  <button id="register">Register</button>
  <pre id="output"></pre>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-aOYS4SxBin4ks17MzX_TVtnxzjPLhD8",
      authDomain: "quizguard-d8c56.firebaseapp.com",
      databaseURL: "https://quizguard-d8c56-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quizguard-d8c56",
      storageBucket: "quizguard-d8c56.firebasestorage.app",
      messagingSenderId: "1025907204447",
      appId: "1:1025907204447:web:047dc148e89e49e21456ea",
      measurementId: "G-YBKTDS05H3"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const output = document.getElementById('output');

    function log(msg) { output.innerText += msg + '\n'; }

    document.getElementById('login').onclick = async () => {
      const email = document.getElementById('email').value;
      const pwd = document.getElementById('password').value;
      log(`Attempting login: ${email}`);
      try {
        const userCred = await auth.signInWithEmailAndPassword(email, pwd);
        log(`Success: ${userCred.user.email}, verified: ${userCred.user.emailVerified}`);
      } catch (err) {
        log(`Error: ${err.code} - ${err.message}`);
      }
    };

    document.getElementById('register').onclick = async () => {
      const email = document.getElementById('email').value;
      const pwd = document.getElementById('password').value;
      log(`Attempting register: ${email}`);
      try {
        const userCred = await auth.createUserWithEmailAndPassword(email, pwd);
        log(`Success: ${userCred.user.email}`);
      } catch (err) {
        log(`Error: ${err.code} - ${err.message}`);
      }
    };
  </script>
</body>
</html>
